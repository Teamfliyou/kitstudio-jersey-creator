<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitStudio – Créateur de maillots</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1d242e; --line:#2a3340; --text:#e8edf3; --mut:#8b97a7;
  --accent:#c6f432; --accent-ink:#0e1116; --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:16px}
.brand small{font-weight:400;color:var(--mut);font-size:12px;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#44546a;background:#243040}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.app{display:grid;grid-template-columns:1fr 440px;height:calc(100vh - 57px)}
.stage{display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(ellipse at 50% 38%,#26303d 0%,#12161c 70%)}
.viewbar{display:flex;justify-content:center;gap:6px;padding:14px 14px 0;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--mut)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.preview{flex:1;min-height:0;position:relative;margin:10px 20px}
.preview svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 22px 28px rgba(0,0,0,.5))}
.actions{display:flex;gap:8px;justify-content:center;align-items:center;padding:0 14px 16px;flex-wrap:wrap}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto;flex:none;scrollbar-width:thin}
.tabs button{flex:1 0 auto;padding:12px 10px;font-size:13px;white-space:nowrap;border:0;background:transparent;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--text)}
.pane{overflow:auto;padding:16px 18px 30px;flex:1}
.pane[hidden]{display:none}
.sec{margin-bottom:22px}
.sec h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row>label{flex:0 0 118px;color:var(--mut)}
.row>.grow{flex:1;min-width:0}
.row .seg{width:100%}
.row>label.chk{flex:1}
.row .seg button{flex:1;padding:6px 6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{flex:0 0 34px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=text],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.sw{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;width:100%}
.sw:hover{border-color:#44546a}
.sw b{width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.25);flex:0 0 auto}
.sw span{color:var(--mut);font-family:Consolas,monospace;font-size:12px}
.grid{display:grid;gap:8px}
.lt svg{width:100%;height:34px;display:block;margin:6px 0 4px;background:#fff;border-radius:6px;padding:3px 2px}
.lt .lg{height:34px;margin:6px 0 4px;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--text)}
.grid.pat{grid-template-columns:repeat(4,1fr)}
.grid.pre{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:4px 2px 6px;cursor:pointer;text-align:center;color:var(--mut);font-size:11px}
.tile:hover{border-color:#44546a}
.tile.on{border-color:var(--accent);color:var(--text)}
.tile svg{width:100%;height:64px;display:block}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.pop{position:fixed;z-index:50;background:#1f2732;border:1px solid #3a475a;border-radius:12px;padding:12px;width:228px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.pop[hidden]{display:none}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:10px}
.chips button{aspect-ratio:1;border-radius:6px;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.chips button:hover{transform:scale(1.15)}
.pop .cust{display:flex;gap:8px;align-items:center}
.pop input[type=color]{width:40px;height:32px;border:0;background:none;padding:0;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .tile{position:relative}
.gal .tile .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;cursor:pointer;line-height:1;font-size:13px}
.gal .tile .x:hover{background:#d7263d}
.hint{color:var(--mut);font-size:12px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:62vh;min-height:380px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pane{max-height:none}
  header .brand small{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand"><i>⚽</i> KitStudio <small>Créateur de maillots · v2</small></div>
  <div style="display:flex;gap:8px">
    <button class="btn" id="btnRandom">🎲 Aléatoire</button>
    <button class="btn" id="btnReset">Réinitialiser</button>
  </div>
</header>

<div class="app">
  <section class="stage">
    <div class="viewbar"><div class="seg" id="viewSeg"></div></div>
    <div class="preview" id="preview"></div>
    <div class="actions">
      <div class="seg" id="bgSeg"></div>
      <button class="btn primary" id="btnPng">⬇ Télécharger PNG</button>
      <button class="btn" id="btnSvg">SVG</button>
      <button class="btn" id="btnLink">🔗 Copier le lien</button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="panes"></div>
  </aside>
</div>

<div class="pop" id="pop" hidden>
  <div class="chips" id="chips"></div>
  <div class="cust"><input type="color" id="popColor"><input type="text" id="popHex" maxlength="7" spellcheck="false"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= Données ================= */
const FONTS = [
  ["Impact",        "Impact, 'Arial Narrow Bold', 'Haettenschweiler', sans-serif"],
  ["Arial Black",   "'Arial Black', 'Arial Bold', Gadget, sans-serif"],
  ["Segoe Black",   "'Segoe UI Black', 'Segoe UI', Arial, sans-serif"],
  ["Verdana",       "Verdana, Geneva, sans-serif"],
  ["Trebuchet",     "'Trebuchet MS', Helvetica, sans-serif"],
  ["Georgia",       "Georgia, 'Times New Roman', serif"],
  ["Courier",       "'Courier New', Courier, monospace"]
];
const PATTERNS = [
  ['solid','Uni'],['stripes-v','Rayures'],['stripes-thin','Fines'],['hoops','Cerceaux'],
  ['band-v','Bande'],['band-h','Poitrine'],['sash','Écharpe'],['half','Moitié'],
  ['quarters','Quartiers'],['chevron','Chevrons'],['checker','Damier'],['diamonds','Losanges'],['gradient','Dégradé']
];
const PALETTE = ['#ffffff','#111111','#d7263d','#0b3d91','#1e88e5','#87ceeb','#f4d35e','#c9a227',
                 '#0a8f4d','#0f5132','#ff7a00','#7b2cbf','#8d0f2c','#f78fb3','#9aa0a6','#3a1c71'];

const slot = o => Object.assign({logo:'none', text:'SPONSOR', size:1, color:'#111111', mono:false, plate:true, plateColor:'#ffffff', image:null}, o||{});
const DEFAULT = {
  neck:'round', sleeve:'short', pattern:'stripes-v', density:7,
  colors:{c1:'#ffffff', c2:'#d7263d', c3:'#111111'},
  collar:'#d7263d', trim:'#d7263d',
  shoulderOn:false, shoulder:'#111111',
  sleeveSolid:false, sleeveColor:'#d7263d',
  text:{name:'DUPONT', number:'9', font:0, fill:'#111111', stroke:'#ffffff', sw:2, frontNumber:true},
  crest:{show:true, type:'shield', pos:'left', size:1, c1:'#d7263d', c2:'#ffffff', letters:'FC', image:null},
  sp:{ chest:slot({logo:'volta'}), back:slot(), sleeveL:slot(), sleeveR:slot(), maker:slot(), shorts:slot() },
  kit:{shorts:'#111111', shortsTrim:'#d7263d', socks:'#d7263d', socksTrim:'#ffffff'},
  view:'both'
};
const clone = o => JSON.parse(JSON.stringify(o));
function merge(t, s){ for(const k in s){ if(s[k] && typeof s[k]==='object' && !Array.isArray(s[k])) t[k]=merge(t[k]||{}, s[k]); else t[k]=s[k]; } return t; }

// Préréglages : [nom, motif, densité, c1, c2, c3, col/liseré, encolure, texte]
const PRESET_DEFS = [
  ['Classique','stripes-v',7,'#ffffff','#d7263d','#111111','#d7263d','round','#111111'],
  ['Azur','stripes-v',9,'#87ceeb','#ffffff','#0b3d91','#0b3d91','v','#0b3d91'],
  ['Nocturne','solid',7,'#111111','#c9a227','#111111','#c9a227','polo','#c9a227'],
  ['Cerceaux','hoops',8,'#ffffff','#0a8f4d','#111111','#0a8f4d','round','#111111'],
  ['Écarlate','sash',7,'#d7263d','#ffffff','#111111','#ffffff','v','#ffffff'],
  ['Marine','half',7,'#0b3d91','#87ceeb','#ffffff','#ffffff','round','#ffffff'],
  ['Orange','chevron',7,'#ff7a00','#111111','#ffffff','#111111','polo','#111111'],
  ['Violet','checker',9,'#7b2cbf','#f4d35e','#ffffff','#f4d35e','round','#ffffff'],
  ['Sunset','gradient',7,'#f4d35e','#d7263d','#3a1c71','#3a1c71','v','#ffffff'],
  ['Bande','band-v',7,'#0f5132','#ffffff','#f4d35e','#f4d35e','polo','#ffffff'],
  ['Poitrine','band-h',7,'#1e88e5','#ffffff','#111111','#111111','round','#111111'],
  ['Losanges','diamonds',7,'#8d0f2c','#0b3d91','#f4d35e','#f4d35e','v','#f4d35e']
];
const PRESETS = PRESET_DEFS.map(([name,pattern,density,c1,c2,c3,collar,neck,fill])=>{
  const dark = c1==='#111111'||c1==='#0b3d91'||c1==='#7b2cbf'||c1==='#8d0f2c'||c1==='#0f5132';
  return {name, s: merge(clone(DEFAULT), {
    pattern, density, neck, colors:{c1,c2,c3}, collar, trim:collar,
    text:{fill, stroke: dark?'#111111':'#ffffff'},
    crest:{c1:c3===c1?c2:c3, c2:c1},
    sp:{chest:{color:fill}},
    kit:{shorts: dark?c1:c3, shortsTrim:c2, socks:c2, socksTrim:c1}
  })};
});

/* ================= État ================= */
let S = clone(DEFAULT);
try{
  const raw = localStorage.getItem('kitstudio.state');
  if(raw) S = merge(clone(DEFAULT), JSON.parse(raw));
}catch(e){}
try{
  const h = location.hash.match(/^#k=(.+)$/);
  if(h) S = merge(clone(DEFAULT), JSON.parse(decodeURIComponent(escape(atob(h[1])))));
}catch(e){}

const rp = p => typeof p==='function' ? p() : p;
const get = p => rp(p).split('.').reduce((o,k)=>o[k], S);
function set(p, v){
  const ks = rp(p).split('.'); let o = S;
  for(let i=0;i<ks.length-1;i++) o = o[ks[i]];
  o[ks[ks.length-1]] = v;
  changed();
}

/* ================= Rendu SVG ================= */
let uid = 0;
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function patternSVG(s){
  const {c1,c2,c3} = s.colors; const n = s.density;
  const odd = n%2 ? n : n+1;
  let defs='', body='';
  switch(s.pattern){
    case 'stripes-v': { const k=(odd-1)/2, w=400/odd;
      for(let i=0;i<odd;i++) if(Math.abs(i-k)%2===0) body+=`<rect x="${i*w}" y="0" width="${w+.5}" height="440" fill="${c2}"/>`; break; }
    case 'stripes-thin': { const w=400/odd;
      for(let i=0;i<odd;i++) body+=`<rect x="${(i+.5)*w - w*.14}" y="0" width="${w*.28}" height="440" fill="${c2}"/>`; break; }
    case 'hoops': { const h=400/n;
      for(let i=0;i<n;i++) if(i%2===1) body+=`<rect x="0" y="${40+i*h}" width="400" height="${h+.5}" fill="${c2}"/>`; break; }
    case 'band-v':
      body=`<rect x="140" y="0" width="120" height="440" fill="${c3}"/><rect x="150" y="0" width="100" height="440" fill="${c2}"/>`; break;
    case 'band-h':
      body=`<rect x="0" y="140" width="400" height="90" fill="${c3}"/><rect x="0" y="150" width="400" height="70" fill="${c2}"/>`; break;
    case 'sash':
      body=`<g transform="rotate(-32 200 230)"><rect x="-120" y="183" width="640" height="94" fill="${c3}"/><rect x="-120" y="193" width="640" height="74" fill="${c2}"/></g>`; break;
    case 'half':
      body=`<rect x="200" y="0" width="200" height="440" fill="${c2}"/><rect x="196" y="0" width="8" height="440" fill="${c3}"/>`; break;
    case 'quarters':
      body=`<rect x="0" y="0" width="200" height="225" fill="${c2}"/><rect x="200" y="225" width="200" height="215" fill="${c2}"/>`; break;
    case 'chevron': { const step=Math.max(40,620/n), h=step/2;
      for(let y=40;y<460;y+=step) body+=`<path d="M0 ${y} L200 ${y+55} L400 ${y} L400 ${y+h} L200 ${y+h+55} L0 ${y+h} Z" fill="${c2}"/>`; break; }
    case 'checker': { const q=400/n;
      for(let r=0;r*q<400;r++) for(let c=0;c<n;c++) if((r+c)%2) body+=`<rect x="${c*q}" y="${40+r*q}" width="${q+.3}" height="${q+.3}" fill="${c2}"/>`; break; }
    case 'diamonds': { const w=700/n, h=w*1.4;
      for(let r=-1;r*h/2<460;r++) for(let c=-1;c*w<420;c++){
        const cx=c*w+(r%2?w/2:0), cy=40+r*h/2;
        body+=`<polygon points="${cx},${cy-h*.4} ${cx+w*.4},${cy} ${cx},${cy+h*.4} ${cx-w*.4},${cy}" fill="${c2}"/>`;
      } break; }
    case 'gradient':
      defs=`<linearGradient id="GRAD" x1="0" y1="0" x2="0" y2="1"><stop offset=".15" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
      body=`<rect width="400" height="440" fill="url(#GRAD)"/>`; break;
  }
  return {defs, body};
}


/* ===== Sponsors (marques fictives) ===== */
const BRANDS = [
  {id:'volta',name:'VOLTA',a:'#ff7a00',b:'#111111',icon:'<path d="M4 -14 L-10 3 L-2 3 L-5 14 L10 -5 L2 -5 Z" fill="currentColor"/>'},
  {id:'novabank',name:'NOVABANK',a:'#0b3d91',b:'#0b3d91',icon:'<circle r="10" fill="none" stroke="currentColor" stroke-width="5"/><circle r="3" fill="currentColor"/>'},
  {id:'aeroline',name:'AEROLINE',a:'#1e88e5',b:'#111111',icon:'<path d="M-14 8 Q0 -14 14 -10 Q2 -2 -2 8 Z" fill="currentColor"/>'},
  {id:'fresh',name:'fresh',lc:1,a:'#0a8f4d',b:'#0a8f4d',icon:'<path d="M-12 10 Q-12 -12 12 -12 Q12 10 -12 10 Z" fill="currentColor"/>'},
  {id:'titan',name:'TITAN',a:'#111111',b:'#111111',icon:'<polygon points="14,0 7,12 -7,12 -14,0 -7,-12 7,-12" fill="currentColor"/>'},
  {id:'zenith',name:'ZENITH',a:'#d7263d',b:'#111111',icon:'<path d="M0 -14 L14 12 L-14 12 Z" fill="currentColor"/>'},
  {id:'pulse',name:'PULSE',a:'#d7263d',b:'#d7263d',icon:'<path d="M-14 0 L-6 0 L-3 -10 L2 10 L5 0 L14 0" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'},
  {id:'orbit',name:'ORBIT',a:'#7b2cbf',b:'#3a1c71',icon:'<circle r="9" fill="none" stroke="currentColor" stroke-width="3.5"/><circle cx="9" cy="-9" r="4" fill="currentColor"/>'},
  {id:'kick',name:'KICK',a:'#ff7a00',b:'#111111',icon:'<path d="M-14 12 L-6 -12 L-2 -12 L-10 12Z M-5 12 L3 -12 L7 -12 L-1 12Z M4 12 L12 -12 L16 -12 L8 12Z" fill="currentColor"/>'},
  {id:'motorx',name:'MOTORX',a:'#d7263d',b:'#111111',icon:'<path d="M-12 -12 L0 0 L-12 12 M0 -12 L12 0 L0 12" fill="none" stroke="currentColor" stroke-width="5"/>'}
];
function brandSVG(b, sl){
  const A = sl.mono ? sl.color : b.a, B = sl.mono ? sl.color : b.b;
  const tw = b.name.length*(b.lc?9.5:11.5), w = 36+tw;
  return {w, svg:`<g transform="translate(${-w/2} 0)"><g transform="translate(16 0)" color="${A}">${b.icon}</g>
    <text x="36" y="6.5" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="${b.lc?19:17}" fill="${B}" textLength="${tw}" lengthAdjust="spacingAndGlyphs">${b.name}</text></g>`};
}
function sponsorSVG(sl, x, y, maxW){
  if(!sl || sl.logo==='none') return '';
  if(sl.logo==='text'){
    if(!sl.text) return '';
    const fs=26*sl.size;
    return `<g transform="translate(${x} ${y})">${textSVG(sl.text.toUpperCase(),0,fs*.35,fs,"'Arial Black', Arial, sans-serif",sl.color,'none',0,maxW)}</g>`;
  }
  let inner, w;
  if(sl.logo==='custom'){
    if(!sl.image) return '';
    w=120; inner=`<image href="${sl.image}" x="-60" y="-20" width="120" height="40" preserveAspectRatio="xMidYMid meet"/>`;
  }else{
    const b=BRANDS.find(b=>b.id===sl.logo); if(!b) return '';
    ({w,svg:inner}=brandSVG(b,sl));
  }
  const pad = sl.plate ? 12 : 0;
  const k = Math.min(sl.size, maxW/(w+pad));
  const plate = sl.plate ? `<rect x="${-w/2-6}" y="-15" width="${w+12}" height="30" rx="7" fill="${sl.plateColor}" stroke="#000" stroke-opacity=".18"/>` : '';
  return `<g transform="translate(${x} ${y}) scale(${k.toFixed(3)})">${plate}${inner}</g>`;
}

function crestSVG(c){
  if(!c.show) return '';
  const x = c.pos==='left'?152 : c.pos==='right'?248 : 200;
  let g='';
  if(c.image) g=`<image href="${c.image}" x="-24" y="-24" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>`;
  else{
    let shape;
    if(c.type==='shield') shape=`<path d="M-18 -20 L18 -20 L18 4 Q18 20 0 28 Q-18 20 -18 4 Z" fill="${c.c1}" stroke="${c.c2}" stroke-width="2.5" stroke-linejoin="round"/>`;
    else if(c.type==='round') shape=`<circle r="21" fill="${c.c1}" stroke="${c.c2}" stroke-width="2.5"/>`;
    else if(c.type==='diamond') shape=`<path d="M0 -25 L22 0 L0 25 L-22 0 Z" fill="${c.c1}" stroke="${c.c2}" stroke-width="2.5" stroke-linejoin="round"/>`;
    else { // étoile
      let pts=''; for(let i=0;i<10;i++){const r=i%2?10:24,a=-Math.PI/2+i*Math.PI/5;pts+=`${(r*Math.cos(a)).toFixed(1)},${(r*Math.sin(a)).toFixed(1)} `;}
      shape=`<polygon points="${pts}" fill="${c.c1}" stroke="${c.c2}" stroke-width="2" stroke-linejoin="round"/>`;
    }
    const ty = c.type==='shield'? 5 : 5;
    g = shape + (c.letters?`<text y="${ty}" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="${c.letters.length>2?11:14}" fill="${c.c2}">${esc(c.letters)}</text>`:'');
  }
  return `<g transform="translate(${x} 118) scale(${c.size})">${g}</g>`;
}

function textSVG(str,x,y,size,fam,fill,stroke,sw,maxW){
  if(!str) return '';
  const est = str.length*size*0.62;
  const fit = est>maxW ? ` textLength="${maxW}" lengthAdjust="spacingAndGlyphs"` : '';
  return `<text x="${x}" y="${y}" text-anchor="middle" font-family="${fam}" font-weight="700" font-size="${size}" fill="${fill}" stroke="${sw>0?stroke:'none'}" stroke-width="${sw*2}" paint-order="stroke" stroke-linejoin="round"${fit}>${esc(str)}</text>`;
}

function jerseySVG(s, side, bare){
  const id = 'j'+(++uid);
  const long = s.sleeve==='long';
  const A = long ? {x1:30,y1:318,x2:84,y2:330,pit:165,seam:350} : {x1:22,y1:162,x2:78,y2:190,pit:148,seam:215};
  const front = side==='front';
  let neckD;
  if(!front) neckD='Q200 74 140 45';
  else if(s.neck==='round') neckD='Q200 125 140 45';
  else if(s.neck==='v') neckD='L200 120 L140 45';
  else neckD='L200 98 L140 45';
  const d = `M140 45 L62 82 L${A.x1} ${A.y1} L${A.x2} ${A.y2} L100 ${A.pit} L100 396 Q200 416 300 396 L300 ${A.pit} L${400-A.x2} ${A.y2} L${400-A.x1} ${A.y1} L338 82 L260 45 ${neckD} Z`;
  const neckLine = `M260 45 ${neckD.replace(/ L140 45$/,' L140 45')}`;
  const {c1} = s.colors;
  const pat = patternSVG(s);
  const defs = pat.defs.replace('GRAD','G'+id);
  const bodyPat = pat.body.replace('url(#GRAD)',`url(#G${id})`);

  const sleeveL = `0,0 138,0 138,47 100,${A.pit} 100,${A.seam} 0,${A.seam}`;
  const sleeveR = `400,0 262,0 262,47 300,${A.pit} 300,${A.seam} 400,${A.seam}`;

  let o = `<defs>${defs}
    <clipPath id="c${id}"><path d="${d}"/></clipPath>
    <linearGradient id="h${id}" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".30"/><stop offset=".2" stop-color="#000" stop-opacity=".02"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".10"/><stop offset=".8" stop-color="#000" stop-opacity=".03"/>
      <stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
    <linearGradient id="v${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs>`;
  o += `<g clip-path="url(#c${id})">`;
  o += `<rect width="400" height="440" fill="${c1}"/>${bodyPat}`;
  if(s.sleeveSolid) o += `<polygon points="${sleeveL}" fill="${s.sleeveColor}"/><polygon points="${sleeveR}" fill="${s.sleeveColor}"/>`;
  // épaulettes
  if(s.shoulderOn) o += `<path d="M140 45 L62 82 M260 45 L338 82" stroke="${s.shoulder}" stroke-width="16" fill="none"/>`;
  // poignets
  o += `<path d="M${A.x1} ${A.y1} L${A.x2} ${A.y2} M${400-A.x1} ${A.y1} L${400-A.x2} ${A.y2}" stroke="${s.trim}" stroke-width="${long?26:22}" fill="none"/>`;
  // col
  if(s.neck!=='polo' || !front) o += `<path d="${neckLine}" stroke="${s.collar}" stroke-width="20" fill="none" stroke-linejoin="miter"/>`;
  else o += `<path d="${neckLine}" stroke="${s.collar}" stroke-width="12" fill="none"/>`;
  // ombrages
  o += `<rect width="400" height="440" fill="url(#h${id})"/><rect width="400" height="440" fill="url(#v${id})"/>`;
  o += `<path d="M138 48 L100 ${A.pit} M262 48 L300 ${A.pit}" stroke="#000" stroke-opacity=".22" stroke-width="1.6" fill="none"/>`;
  o += `<path d="M128 170 Q140 290 124 392 M272 170 Q260 290 276 392" stroke="#000" stroke-opacity=".07" stroke-width="7" fill="none"/>`;
  o += `<path d="M168 215 Q200 232 232 215" stroke="#fff" stroke-opacity=".06" stroke-width="10" fill="none"/>`;
  o += `</g>`;
  o += `<path d="${d}" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="1.6" stroke-linejoin="round"/>`;
  // polo : rabats
  if(front && s.neck==='polo'){
    o += `<g stroke="#000" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round">
      <path d="M128 38 L200 100 L184 124 L112 62 Z" fill="${s.collar}"/>
      <path d="M272 38 L200 100 L216 124 L288 62 Z" fill="${s.collar}"/></g>
      <rect x="195" y="98" width="10" height="56" rx="2" fill="${c1}" stroke="#000" stroke-opacity=".25"/>
      <circle cx="200" cy="112" r="2.4" fill="#000" fill-opacity=".45"/><circle cx="200" cy="136" r="2.4" fill="#000" fill-opacity=".45"/>`;
  }
  if(!bare){
    const t = s.text, fam = FONTS[t.font][1];
    if(front){
      o += crestSVG(s.crest);
      o += sponsorSVG(s.sp.chest,200,195,170) + sponsorSVG(s.sp.maker,248,114,44);
      if(t.frontNumber && t.number) o += textSVG(t.number,200,362,48,fam,t.fill,t.stroke,t.sw*.6,80);
    }else{
      o += textSVG((t.name||'').toUpperCase(),200,112,Math.min(36,176/Math.max(1,(t.name||'').length*.6)),fam,t.fill,t.stroke,t.sw*.7,176);
      o += textSVG(t.number||'',200,290,160,fam,t.fill,t.stroke,t.sw*1.5,180);
      o += sponsorSVG(s.sp.back,200,345,150);
    }
    const sx = long?66:60, sy = long?235:130;
    o += sponsorSVG(s.sp.sleeveL,sx,sy,40) + sponsorSVG(s.sp.sleeveR,400-sx,sy,40);
  }
  return o;
}

function shortsSVG(s){
  const id='s'+(++uid);
  const k=s.kit;
  return `<defs><clipPath id="${id}"><path d="M108 372 L292 372 L308 528 L214 540 L200 470 L186 540 L92 528 Z"/></clipPath></defs>
  <g clip-path="url(#${id})"><rect x="80" y="360" width="240" height="200" fill="${k.shorts}"/>
    <path d="M108 372 L92 528 M292 372 L308 528" stroke="${k.shortsTrim}" stroke-width="22" fill="none"/>
    <path d="M92 528 L186 540 M308 528 L214 540" stroke="${k.shortsTrim}" stroke-width="10" fill="none"/>
    <rect x="80" y="360" width="240" height="200" fill="#000" opacity=".07"/>
    <path d="M200 395 L200 470" stroke="#000" stroke-opacity=".3" stroke-width="2"/></g>
  <path d="M108 372 L292 372 L308 528 L214 540 L200 470 L186 540 L92 528 Z" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="1.6" stroke-linejoin="round"/>`+sponsorSVG(s.sp.shorts,146,452,56);
}
function sockSVG(s){
  const k=s.kit; const id='k'+(++uid);
  const sock = `<path d="M122 566 L182 566 L178 770 Q176 806 140 812 L102 812 Q92 786 114 770 Z"/>`;
  return `<defs><clipPath id="${id}">${sock}</clipPath></defs>
  <g clip-path="url(#${id})"><rect x="90" y="560" width="100" height="260" fill="${k.socks}"/>
    <rect x="90" y="566" width="100" height="26" fill="${k.socksTrim}"/><rect x="90" y="592" width="100" height="6" fill="${k.socksTrim}" opacity=".7"/>
    <rect x="90" y="560" width="100" height="260" fill="#000" opacity=".06"/></g>
  <g fill="none" stroke="#000" stroke-opacity=".38" stroke-width="1.6" stroke-linejoin="round">${sock.replace('/>',' />')}</g>`;
}

function renderSVG(s, view, opt={}){
  let vb, inner='';
  if(view==='front'||view==='back'){ vb=[-20,0,440,440]; inner=jerseySVG(s,view,opt.bare); }
  else if(view==='both'){ vb=[-20,0,860,440]; inner=`<g>${jerseySVG(s,'front',opt.bare)}</g><g transform="translate(420 0)">${jerseySVG(s,'back',opt.bare)}</g>`; }
  else { vb=[-20,0,440,830];
    inner=shortsSVG(s)+`<g transform="translate(0 0)">${sockSVG(s)}</g><g transform="translate(400 0) scale(-1 1)">${sockSVG(s)}</g>`+jerseySVG(s,'front',opt.bare); }
  const bg = opt.bg ? `<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="${opt.bg}"/>` : '';
  const size = opt.w ? ` width="${opt.w}" height="${Math.round(opt.w*vb[3]/vb[2])}"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}"${size}>${bg}${inner}</svg>`;
}

const $ = (s,r=document)=>r.querySelector(s);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else if(k==='class') e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));
  return e;
}
const syncs=[];

function choice(path, options){
  const w=el('div',{class:'seg'});
  options.forEach(([v,l])=>{ const b=el('button',{type:'button',onclick:()=>set(path,v)},l); b.dataset.v=v; w.append(b); });
  syncs.push(()=>[...w.children].forEach(b=>b.classList.toggle('on',b.dataset.v===String(get(path)))));
  return w;
}
function row(label,ctrl){ return el('div',{class:'row'},el('label',{},label),el('div',{class:'grow'},ctrl)); }
function range(path,label,min,max,step=1,fmt=v=>v){
  const i=el('input',{type:'range',min,max,step}); const v=el('span',{class:'val'});
  i.addEventListener('input',()=>set(path,+i.value));
  syncs.push(()=>{ if(+i.value!==+get(path)) i.value=get(path); v.textContent=fmt(get(path)); });
  return el('div',{class:'row'},el('label',{},label),el('div',{class:'grow'},i),v);
}
function toggle(path,label){
  const i=el('input',{type:'checkbox'}); i.addEventListener('change',()=>set(path,i.checked));
  syncs.push(()=>{ i.checked=!!get(path); });
  return el('div',{class:'row'},el('label',{class:'chk'},i,label));
}
function textField(path,label,ph,tf=v=>v,max=24){
  const i=el('input',{type:'text',placeholder:ph||'',maxlength:max,spellcheck:'false'});
  i.addEventListener('input',()=>{ set(path,tf(i.value)); });
  syncs.push(()=>{ if(i.value!==get(path)) i.value=get(path); });
  return row(label,i);
}
function colorField(path,label){
  const b=el('b'), t=el('span');
  const btn=el('button',{type:'button',class:'sw',onclick:e=>openPop(path,btn)},b,t);
  syncs.push(()=>{ b.style.background=get(path); t.textContent=get(path).toUpperCase(); });

}
function select(path,label,options){
  const s=el('select'); options.forEach(([v,l])=>s.append(el('option',{value:v},l)));

}

function openPop(path, anchor){

}

const viewSeg=$('#viewSeg');
[['both','Face + Dos'],['front','Face'],['back','Dos'],['kit','Tenue']].forEach(([v,l])=>{
  const b=el('button',{type:'button',onclick:()=>set('view',v)},l); b.dataset.v=v; viewSeg.append(b);
});
let bgMode='#f4f5f7';
const bgSeg=$('#bgSeg');
[['#f4f5f7','Fond clair'],['transparent','Transparent']].forEach(([v,l])=>{
  const b=el('button',{type:'button',onclick:()=>{ bgMode=v; [...bgSeg.children].forEach(x=>x.classList.toggle('on',x.dataset.v===v)); }},l); b.dataset.v=v; if(v===bgMode) b.classList.add('on'); bgSeg.append(b);
});

/* ================= Boucle ================= */
function render(){
  $('#preview').innerHTML=renderSVG(S,S.view);
  [...viewSeg.children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
}
function save(){ try{ localStorage.setItem('kitstudio.state',JSON.stringify(S)); }catch(e){} }
function changed(){ render(); syncs.forEach(f=>f()); save(); }

/* ================= Export ================= */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
const fname = ext => `maillot-${(S.text.name||'kit').toLowerCase()}-${S.view}.${ext}`;

$('#btnSvg').onclick=()=>{ download(new Blob([renderSVG(S,S.view,{w:1200,bg:bgMode==='transparent'?null:bgMode})],{type:'image/svg+xml'}),fname('svg')); };
$('#btnPng').onclick=()=>{
  const w = S.view==='both'?2400:1400;
  const svg=renderSVG(S,S.view,{w,bg:bgMode==='transparent'?null:bgMode});
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);
    c.toBlob(b=>{ if(b){ download(b,fname('png')); toast('PNG téléchargé'); } else toast('Export impossible'); },'image/png');
  };
  img.onerror=()=>toast('Export impossible');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('#btnLink').onclick=async()=>{
  const c=clone(S); c.crest.image=null;
  const url=location.origin+location.pathname+'#k='+btoa(unescape(encodeURIComponent(JSON.stringify(c))));
  try{ await navigator.clipboard.writeText(url); toast(S.crest.image?'Lien copié (sans le logo importé)':'Lien copié !'); }
  catch(e){ prompt('Copiez ce lien :',url); }
  try{ history.replaceState(null,'',url); }catch(e){}
};
$('#btnReset').onclick=()=>{ if(confirm('Revenir au maillot par défaut ?')){ S=clone(DEFAULT); changed(); } };
$('#btnRandom').onclick=()=>{
  const R=a=>a[Math.floor(Math.random()*a.length)];
  const pick=()=>R(PALETTE);
  let c1=pick(),c2=pick(); while(c2===c1) c2=pick();
  let c3=pick(); while(c3===c1||c3===c2) c3=pick();
  S.colors={c1,c2,c3}; S.pattern=R(PATTERNS)[0]; S.density=R([5,7,9,11]);
  S.neck=R(['round','v','polo']); S.collar=c2; S.trim=c2; S.shoulder=c3;
  S.sleeveSolid=false; S.shoulderOn=Math.random()<.3;
  S.crest.c1=c3; S.crest.c2=c1;
  const light=['#ffffff','#f4d35e','#87ceeb','#f78fb3','#9aa0a6','#ff7a00'].includes(c1);
  S.text.fill=light?'#111111':'#ffffff'; S.text.stroke=light?'#ffffff':'#111111'; S.sp.chest.color=S.text.fill;
  S.kit={shorts:c3,shortsTrim:c2,socks:c2,socksTrim:c1};
  changed();
};

changed();
</script>
</body>
</html>
