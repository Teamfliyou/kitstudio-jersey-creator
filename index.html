<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitStudio – Créateur de maillots</title>
<meta name="description" content="Créez des maillots de sport : motifs, couleurs, sponsors, rendu 3D et export HD.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand"><span class="logo">K</span><b>KitStudio</b><span class="ver">v3</span></div>
    <div class="tb-group">
      <button class="icon-btn" id="btnUndo" title="Annuler (Ctrl+Z)" aria-label="Annuler" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 7H15a5 5 0 010 10H8M9 7L5 11m4-4L5 3"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 7H9a5 5 0 000 10h7M15 7l4 4m-4-4l4-4"/></svg></button>
    </div>
    <div class="modeseg seg" id="modeSeg" role="tablist" aria-label="Mode d'affichage">
      <button data-v="2d" role="tab">Plan 2D</button>
      <button data-v="3d" role="tab">Rendu 3D</button>
    </div>
    <div class="tb-spacer"></div>
    <button class="btn ghost" id="btnRandom" title="Générer une combinaison au hasard">🎲 Aléatoire</button>
    <button class="btn ghost" id="btnReset">Réinitialiser</button>
    <button class="btn" id="btnLink">Partager</button>
    <button class="btn primary" id="btnExport">Exporter</button>
  </header>

  <nav class="rail" id="rail" aria-label="Outils"></nav>

  <aside class="panel">
    <div class="panel-head"><h2 id="panelTitle"></h2><p id="panelSub"></p></div>
    <div id="panes"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="canvas2d" id="preview"></div>
    <div class="canvas3d" id="view3d" hidden></div>
    <div class="floatbar" id="floatbar"></div>
    <div class="stagehint" id="stageHint"></div>
    <div class="nogl" id="noGL" hidden>Le rendu 3D n'est pas disponible sur cet appareil (WebGL requis).</div>
  </main>
</div>

<div class="pop" id="pop" hidden>
  <div class="chips" id="chips"></div>
  <div class="cust"><input type="color" id="popColor" aria-label="Couleur personnalisée"><input type="text" id="popHex" maxlength="7" spellcheck="false" aria-label="Code hexadécimal"></div>
</div>

<dialog id="exportDlg">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2>Exporter</h2><button class="icon-btn" value="cancel" aria-label="Fermer">✕</button></div>
    <div class="dlg-body" id="exportBody"></div>
    <div class="dlg-foot"><span id="exportInfo" class="hint"></span><button type="button" class="btn primary" id="btnDoExport">Télécharger</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/library.js"></script>
<script src="js/view3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
